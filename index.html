<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
    background: #000;
  }
  canvas.drag { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
(() => {
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {
  antialias: false, alpha: false, depth: false, stencil: false,
  powerPreference: 'high-performance', preserveDrawingBuffer: false
});
if (!gl) { console.error('WebGL2 not available'); return; }

const VS = `#version 300 es
in vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

const FS = `#version 300 es
precision highp float;
out vec4 o;

uniform vec2  uRes;
uniform float uTime;
uniform mat3  uCam;      // camera basis: right, up, back
uniform float uDist;
uniform float uPower;
uniform vec3  uJulia;
uniform float uJuliaMix;
uniform float uWarp;
uniform float uTwist;
uniform float uPulse;
uniform float uDrip;
uniform float uClear;

#define MAX_STEPS 140
#define ITER 8
#define BOUND 2.8
const vec3 CEN = vec3(0., -.35, 0.);

mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

vec3 pal(float t, vec3 a, vec3 b, vec3 c, vec3 d){ return a + b * cos(6.28318 * (c * t + d)); }
vec3 palHot(float t){ return pal(t, vec3(.55,.25,.30), vec3(.45,.30,.35), vec3(1.,.8,.6), vec3(0.,.15,.55)); }
vec3 palAcid(float t){ return pal(t, vec3(.5), vec3(.5), vec3(2.,1.,0.), vec3(.5,.2,.25)); }
vec3 palIrid(float t){ return pal(t, vec3(.5), vec3(.5), vec3(1.), vec3(0.,.33,.67)); }

float smin(float a, float b, float k){
  float h = clamp(.5 + .5 * (b - a) / k, 0., 1.);
  return mix(b, a, h) - k * h * (1. - h);
}
float sminH(float a, float b, float k, out float h){
  h = clamp(.5 + .5 * (b - a) / k, 0., 1.);
  return mix(b, a, h) - k * h * (1. - h);
}
float smax(float a, float b, float k){ return -smin(-a, -b, k); }

vec3 warp(vec3 p){
  float t = uTime * .35;
  vec3 q = p;
  q += .22 * sin(q.zxy * 1.3 + vec3(t * .8, t * .6, t * 1.1));
  q.xz *= rot(uTwist * q.y + .3 * sin(t * .7));
  q.xy *= rot(.25 * uTwist * q.z);
  q += uWarp * .11 * sin(q.yzx * 3.1 + vec3(t, t * 1.3, t * .7));
  q += uWarp * .045 * sin(q.zxy * 7.3 - vec3(t * 1.7, t * .9, t * 2.1));
  q.x += .09 * sin(q.y * 2.3 + t) + .05 * cos(q.z * 4.1 - t * 1.4);
  return q;
}

vec3 stretch(vec3 p){
  float t = uTime;
  float a = sin(p.x * 3.7 + t * .4 + 1.5 * sin(p.z * 2.9 - t * .3));
  float b = sin(p.z * 3.1 - t * .23 + .8 * p.x);
  float s = pow(clamp(.5 + .5 * a * b, 0., 1.), 2.5) * uDrip;
  float below = smoothstep(.1, -1., p.y);
  p.y *= 1. - min(.15 + .55 * s, .72) * below;
  return p;
}

float holes(vec3 p){
  float t = uTime * .2;
  vec3 q = p * 1.6 + vec3(t, -t * .7, t * .4);
  float n = sin(q.x) * cos(q.y * 1.3) + sin(q.y) * cos(q.z * 1.1) + sin(q.z * .9) * cos(q.x);
  n += .5 * sin(q.x * 2.3 + q.z * 1.9 - t * 2.);
  return n;
}

float bulb(vec3 p, out vec4 trap){
  vec3 w = p;
  vec3 c = mix(p, uJulia, uJuliaMix);
  float m = dot(w, w);
  vec4 tr = vec4(abs(w), m);
  float dz = 1.;
  float pw = uPower;
  float ph0 = .6 * sin(uTime * .21);
  float ph1 = .4 * cos(uTime * .17);
  for (int i = 0; i < ITER; i++){
    float r = max(sqrt(m), 1e-6);
    dz = pw * pow(r, pw - 1.) * dz + (1. - uJuliaMix);
    float th = acos(clamp(w.y / r, -1., 1.)) * pw + ph0;
    float ph = atan(w.x, w.z) * pw + ph1 + float(i) * .07 * uTwist;
    w = c + pow(r, pw) * vec3(sin(th) * sin(ph), cos(th), sin(th) * cos(ph));
    tr = min(tr, vec4(abs(w), m));
    m = dot(w, w);
    if (m > 64.) break;
  }
  trap = tr;
  return .25 * log(m) * sqrt(m) / dz;
}

float liquid(vec3 p){
  float t = uTime;
  float d = 1e9;
  for (int i = 0; i < 3; i++){
    float fi = float(i);
    vec3 c = vec3(
      sin(t * .27 * (fi + 1.) + fi * 2.1) * 1.5,
      -.3 + cos(t * .21 * (fi + 1.3) + fi) * .9,
      sin(t * .17 * (fi + .7) + fi * 4.) * 1.4
    );
    float r = .1 + .06 * sin(t * .5 + fi * 1.7);
    vec3 q = p - c;
    q += .04 * sin(q.yzx * 9. + t * 2.);
    d = smin(d, length(q) - r, .25);
  }
  for (int i = 0; i < 8; i++){
    float fi = float(i);
    float h1 = fract(sin(fi * 12.9898 + 1.) * 43758.5453);
    float h2 = fract(sin(fi * 78.233 + 2.) * 23421.631);
    float h3 = fract(sin(fi * 39.425 + 3.) * 15731.743);
    float cyc = fract(t * (.07 + .06 * h1) + h2);
    float fall = cyc * cyc;
    vec3 a = vec3((h1 - .5) * 1.5, -.2 - fall * 2.6, (h3 - .5) * 1.5);
    a.xz += .05 * sin(t * .7 + fi);
    float r = (.045 + .05 * h3) * smoothstep(1., .8, cyc);
    float tail = r * (1.5 + 10. * fall);
    vec3 ba = vec3(0., tail, 0.);
    vec3 pa = p - a;
    float hh = clamp(dot(pa, ba) / (dot(ba, ba) + 1e-5), 0., 1.);
    float dd = length(pa - ba * hh) - r * mix(1., .25, hh);
    d = smin(d, dd, .12);
  }
  return d;
}

float map(vec3 p, out vec4 trap, out float mat){
  vec3 q = warp(stretch(p));
  q = q * vec3(.78, 1.05, .9) + vec3(.12, .05, -.08);
  float db = bulb(q, trap);
  db = smax(db, (holes(p) - 1.15) * .14, .1);
  float dl = liquid(p);
  float h;
  float d = sminH(dl, db, .3, h);
  mat = h; // 1 = liquid, 0 = fractal body
  d += uPulse * .025 * sin(length(p - CEN) * 18. - uTime * 9.);
  return d * .55;
}

float mapD(vec3 p){ vec4 t; float m; return map(p, t, m); }

vec3 calcN(vec3 p, float t){
  vec2 e = vec2(1., -1.) * .0006 * max(t, 1.);
  return normalize(
    e.xyy * mapD(p + e.xyy) +
    e.yyx * mapD(p + e.yyx) +
    e.yxy * mapD(p + e.yxy) +
    e.xxx * mapD(p + e.xxx));
}

float calcAO(vec3 p, vec3 n){
  float occ = 0., sca = 1.;
  for (int i = 0; i < 4; i++){
    float h = .02 + .08 * float(i);
    occ += (h - mapD(p + n * h)) * sca;
    sca *= .7;
  }
  return clamp(1. - 2.2 * occ, 0., 1.);
}

vec3 env(vec3 d){
  float a = atan(d.x, d.z) * .159;
  vec3 c = palIrid(d.y * .5 + a + uTime * .02);
  float band = pow(max(0., sin(d.y * 6. + a * 18.85 + uTime * .3)), 10.);
  float band2 = pow(max(0., sin(d.x * 4. - d.z * 3. - uTime * .2)), 16.);
  return c * (.06 + 1.4 * band + .8 * band2);
}

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

vec2 bound(vec3 ro, vec3 rd){
  vec3 oc = ro - CEN;
  float b = dot(oc, rd);
  float c = dot(oc, oc) - BOUND * BOUND;
  float h = b * b - c;
  if (h < 0.) return vec2(-1.);
  h = sqrt(h);
  return vec2(max(-b - h, 0.), -b + h);
}

float march(vec3 ro, vec3 rd, float t, float tmax, int n, float base){
  for (int i = 0; i < MAX_STEPS; i++){
    if (i >= n) break;
    float d = mapD(ro + rd * t);
    if (d < .0007 * (base + t)) return t;
    t += d;
    if (t > tmax) break;
  }
  return -1.;
}

float marchIn(vec3 ro, vec3 rd, float tmax){
  float t = .01;
  for (int i = 0; i < 64; i++){
    float d = -mapD(ro + rd * t);
    if (d < .001) return t;
    t += max(d, .006);
    if (t > tmax) return tmax;
  }
  return t;
}

float clearField(vec3 p, float mt){
  float z = sin(p.x * 1.7 - p.y * 2.3 + uTime * .12)
          + .7 * sin(p.z * 2.6 + p.x * .9 - uTime * .09)
          + .5 * sin(length(p - CEN) * 4. - uTime * .2);
  float c = smoothstep(-.3, .8, z) * uClear;
  return max(c, mt * .5 * uClear);
}

void main(){
  vec2 uv = (gl_FragCoord.xy * 2. - uRes) / uRes.y;

  vec3 uu = uCam[0];
  vec3 vv = uCam[1];
  vec3 bk = uCam[2];
  vec3 ro = CEN + bk * uDist;
  vec3 rd = normalize(uv.x * uu + uv.y * vv - 1.8 * bk);

  vec3 col = vec3(0.);
  vec3 trans = vec3(1.);
  vec3 org = ro, dir = rd;
  float travelled = 0.;

  for (int layer = 0; layer < 3; layer++){
    vec2 bb = bound(org, dir);
    if (bb.y < 0.) break;
    int steps = layer == 0 ? MAX_STEPS : 70;
    float th = march(org, dir, bb.x, bb.y, steps, travelled);
    if (th < 0.) break;

    vec3 p = org + dir * th;
    vec3 n = calcN(p, travelled + th);
    vec4 tr; float mt;
    map(p, tr, mt);
    vec3 q = warp(p);

    float ndv = max(dot(n, -dir), 0.);
    float fres = pow(1. - ndv, 3.);

    vec3 hot  = palHot(sqrt(tr.w) * 1.2 + tr.y * .6 + uTime * .01);
    vec3 acid = palAcid(tr.x * 1.5 + tr.z * .8 - uTime * .015);
    float zone = smoothstep(-.35, .35,
      sin(q.x * 2.1 + q.y * 1.3 - q.z * 1.7 + uTime * .15) + .6 * sin(q.z * 3.3 + q.x - uTime * .07));
    vec3 body = mix(hot, acid, zone);

    vec3 irid = palIrid(ndv * 1.4 + dot(n, vec3(.3, .5, .2)) + p.y * .4 + uTime * .05);
    vec3 drop = irid * .7 + .15;

    vec3 base = mix(body, drop, mt);
    base = mix(base, irid, .35 * fres + .2 * mt);

    float clr = clearField(p, mt);
    float alpha = mix(1., .08, clr);
    alpha = mix(alpha, 1., fres * .8);
    base = mix(base, irid, clr * .5);

    vec3 l1 = normalize(vec3(.6, .8, -.4));
    vec3 l2 = normalize(vec3(-.7, -.2, .6));
    float dif  = max(dot(n, l1), 0.);
    float dif2 = max(dot(n, l2), 0.);
    float ao = layer == 0 ? calcAO(p, n) : .85;
    vec3 r = reflect(dir, n);
    float spec  = pow(max(dot(r, l1), 0.), 48.);
    float spec2 = pow(max(dot(r, l2), 0.), 24.);

    vec3 diffuse = base * (.1 + .9 * dif * vec3(1., .9, .8) + .5 * dif2 * vec3(.4, .5, 1.)) * ao;
    vec3 refl = env(r) * (.25 + .9 * fres) * mix(vec3(1.), base, .5) * ao
              + (spec * vec3(1.) + spec2 * vec3(.6, .7, 1.)) * ao;
    vec3 rim = irid * fres * .35 * (1. + clr * 1.5);

    col += trans * (alpha * diffuse + refl + rim);
    trans *= 1. - alpha;
    if (max(trans.r, max(trans.g, trans.b)) < .03) break;

    vec3 dirIn = normalize(mix(dir, refract(dir, n, .85), .6));
    float te = marchIn(p, dirIn, 2. * BOUND);
    vec3 absorb = (1. - palIrid(uTime * .03 + p.y * .3 + tr.w)) * 2.2;
    trans *= exp(-absorb * te * .9);

    travelled += th + te;
    org = p + dirIn * (te + .012);
    dir = dirIn;
  }

  col = 1. - exp(-col * 1.35);
  col = pow(col, vec3(.9));
  col *= 1. - .25 * dot(uv * .5, uv * .5);
  col += (hash(gl_FragCoord.xy + fract(uTime) * 91.) - .5) * .025;

  o = vec4(max(col, 0.), 1.);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

const U = {};
['uRes','uTime','uCam','uDist','uPower','uJulia','uJuliaMix','uWarp','uTwist','uPulse','uDrip','uClear']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

const maxScale = Math.min(window.devicePixelRatio || 1, 1.5);
let scale = Math.min(0.7, maxScale);
function resize(){
  const w = Math.max(1, Math.floor(innerWidth * scale));
  const h = Math.max(1, Math.floor(innerHeight * scale));
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function qMul(a, b){
  return [
    a[3]*b[0] + a[0]*b[3] + a[1]*b[2] - a[2]*b[1],
    a[3]*b[1] - a[0]*b[2] + a[1]*b[3] + a[2]*b[0],
    a[3]*b[2] + a[0]*b[1] - a[1]*b[0] + a[2]*b[3],
    a[3]*b[3] - a[0]*b[0] - a[1]*b[1] - a[2]*b[2]
  ];
}
function qAxis(x, y, z, ang){
  const s = Math.sin(ang / 2);
  return [x * s, y * s, z * s, Math.cos(ang / 2)];
}
function qNorm(q){
  const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
  return [q[0]/l, q[1]/l, q[2]/l, q[3]/l];
}
function qMat3(q){
  const [x, y, z, w] = q;
  return new Float32Array([
    1 - 2*(y*y + z*z), 2*(x*y + w*z),     2*(x*z - w*y),
    2*(x*y - w*z),     1 - 2*(x*x + z*z), 2*(y*z + w*x),
    2*(x*z + w*y),     2*(y*z - w*x),     1 - 2*(x*x + y*y)
  ]);
}

function spring(s, stiff, damp, f){
  s.v += (-stiff * s.x - damp * s.v) * f;
  s.x += s.v * f;
}

const S = {
  q: qMul(qAxis(0, 1, 0, 0.6), qAxis(1, 0, 0, -0.2)),
  w: [0, 0, 0],               // angular velocity, camera local axes
  dist: 4.0, zoomV: 0,
  power: { x: 0, v: 0 },
  twist: { x: 0, v: 0 },
  warp:  { x: 0, v: 0 },
  pulse: 0,
  mx: 0, my: 0,
  jm: 0.3, j: [0.3, -0.2, 0.4], jv: [0, 0, 0],
  accX: 0, accY: 0
};

const pointers = new Map();
let pinchD = 0;
const pinchDist = () => {
  const p = [...pointers.values()];
  return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
};

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.classList.add('drag');
  S.pulse = 1;
  S.warp.v += 0.04;
  if (pointers.size === 2) pinchD = pinchDist();
});

canvas.addEventListener('pointermove', e => {
  S.mx = e.clientX / innerWidth * 2 - 1;
  S.my = 1 - e.clientY / innerHeight * 2;
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;

  if (pointers.size === 2){
    const d = pinchDist();
    if (pinchD > 0) S.dist = clamp(S.dist * pinchD / d, 1.4, 7);
    pinchD = d;
    return;
  }
  S.accX += dx;
  S.accY += dy;
});

const release = e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchD = 0;
  if (pointers.size === 0){
    canvas.classList.remove('drag');
    S.pulse = Math.max(S.pulse, 0.6);
  }
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  S.zoomV += e.deltaY * 0.00025;
  S.warp.v += 0.004;
}, { passive: false });

const t0 = performance.now();
let last = t0, acc = 0, frames = 0;
const ROT_K = 0.0055;

function frame(now){
  const dt = now - last; last = now;
  if (dt < 200){ acc += dt; frames++; }
  if (frames >= 30){
    const avg = acc / frames;
    if (avg > 24 && scale > 0.3) scale = Math.max(0.3, scale * 0.85);
    else if (avg < 17.5 && scale < maxScale) scale = Math.min(maxScale, scale * 1.05);
    acc = 0; frames = 0;
  }
  resize();

  const f = clamp(dt / 16.667, 0.25, 3);
  const t = (now - t0) / 1000;
  const dragging = pointers.size === 1;
  const dx = S.accX, dy = S.accY;
  S.accX = 0; S.accY = 0;

  if (dragging){
    const tx = -dy * ROT_K / f, ty = -dx * ROT_K / f;
    S.w[0] += (tx - S.w[0]) * 0.6;
    S.w[1] += (ty - S.w[1]) * 0.6;
    S.w[2] *= 0.8;
  } else {
    const fr = Math.pow(0.986, f);
    S.w[0] = S.w[0] * fr;
    S.w[1] = S.w[1] * fr + (-0.0012) * (1 - fr);
    S.w[2] = S.w[2] * fr;
  }
  const wl = Math.hypot(S.w[0], S.w[1], S.w[2]);
  if (wl > 1e-7){
    S.q = qNorm(qMul(S.q, qAxis(S.w[0] / wl, S.w[1] / wl, S.w[2] / wl, wl * f)));
  }

  S.dist = clamp(S.dist * Math.exp(S.zoomV * f), 1.4, 7);
  S.zoomV *= Math.pow(0.88, f);

  const speed = Math.hypot(dx, dy);
  S.power.v += dx * 0.0016;
  S.twist.v += dy * 0.0011;
  S.warp.v  += speed * 0.0012 + wl * 0.02 * f;

  spring(S.power, 0.006, 0.035, f);
  spring(S.twist, 0.012, 0.05, f);
  spring(S.warp,  0.02,  0.07, f);
  S.power.x = clamp(S.power.x, -4, 4);
  S.twist.x = clamp(S.twist.x, -1.5, 1.5);
  S.warp.x  = clamp(S.warp.x, -0.4, 3);
  S.pulse *= Math.pow(0.94, f);

  const power = clamp(7 + 1.6 * Math.sin(t * 0.11) + 0.6 * Math.sin(t * 0.037) + S.power.x, 2.5, 12);

  const jmTarget = dragging ? 0.75 : 0.3 + 0.2 * Math.sin(t * 0.07);
  S.jm += (jmTarget - S.jm) * 0.02 * f;
  const jt = [
    S.mx * 0.9 + 0.2 * Math.sin(t * 0.13),
    S.my * 0.9,
    0.6 * Math.sin(t * 0.09) + 0.3 * Math.cos(t * 0.21)
  ];
  for (let i = 0; i < 3; i++){
    S.jv[i] += ((jt[i] - S.j[i]) * 0.004 - S.jv[i] * 0.06) * f;
    S.j[i] += S.jv[i] * f;
  }

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, t);
  gl.uniformMatrix3fv(U.uCam, false, qMat3(S.q));
  gl.uniform1f(U.uDist, S.dist);
  gl.uniform1f(U.uPower, power);
  gl.uniform3f(U.uJulia, S.j[0], S.j[1], S.j[2]);
  gl.uniform1f(U.uJuliaMix, S.jm);
  gl.uniform1f(U.uWarp, 0.55 + 0.35 * Math.sin(t * 0.19) + S.warp.x);
  gl.uniform1f(U.uTwist, 0.35 * Math.sin(t * 0.08) + S.twist.x);
  gl.uniform1f(U.uPulse, S.pulse);
  gl.uniform1f(U.uClear, clamp(0.62 + 0.38 * Math.sin(t * 0.045 + 1.0) + S.warp.x * 0.1, 0, 1));
  gl.uniform1f(U.uDrip, clamp(0.9 + 0.2 * Math.sin(t * 0.13) + S.warp.x * 0.08, 0, 1.3));

  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
